<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Roulette Wheel</title>
  <script src="https://cjrtnc.leaningtech.com/4.0/cj4loader.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #f0b429;
      letter-spacing: 1px;
    }

    header p {
      color: #8b949e;
      font-size: 0.9rem;
      margin-top: 6px;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 40px;
      color: #8b949e;
      font-size: 0.95rem;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #30363d;
      border-top-color: #f0b429;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #app-container {
      border: 1px solid #30363d;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    footer {
      margin-top: 20px;
      color: #484f58;
      font-size: 0.8rem;
      text-align: center;
    }

    footer a {
      color: #58a6ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Simple Roulette Wheel</h1>
    <p>CPSC 210 Project &mdash; running live in your browser</p>
  </header>

  <div id="loading">
    <div class="spinner"></div>
    <span>Loading game&hellip; (first load may take ~15 seconds)</span>
  </div>

  <div id="app-container" style="display:none"></div>

  <footer>
    Built with Java Swing &bull; Powered by <a href="https://cheerpj.com" target="_blank">CheerpJ</a> &bull;
    <a href="https://github.com/Adrriijs/Roulette-Wheel" target="_blank">Source on GitHub</a>
  </footer>

  <script>
    (async function () {
      await cheerpjInit({ status: "none" });

      const container = document.getElementById("app-container");
      cheerpjCreateDisplay(900, 600, container);

      document.getElementById("loading").style.display = "none";
      container.style.display = "block";

      await cheerpjRunJar("/app/roulette.jar");
    })();
  </script>
</body>
</html>
