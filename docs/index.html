<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Simple Roulette Wheel</title>
  <script src="https://cjrtnc.leaningtech.com/4.0/cj4loader.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    h1 {
      font-size: 2rem;
      color: #f0b429;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #8b949e;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    #loading {
      color: #8b949e;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    footer {
      margin-top: 16px;
      color: #484f58;
      font-size: 0.8rem;
    }

    footer a { color: #58a6ff; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Simple Roulette Wheel</h1>
  <p class="subtitle">CPSC 210 Project &mdash; running live in your browser</p>
  <p id="loading">Loading game&hellip; first load takes ~20 seconds, please wait.</p>
  <footer>
    Built with Java Swing &bull; Powered by <a href="https://cheerpj.com" target="_blank">CheerpJ</a> &bull;
    <a href="https://github.com/Adrriijs/Roulette-Wheel" target="_blank">Source on GitHub</a>
  </footer>

  <script>
    (async function () {
      await cheerpjInit();
      cheerpjCreateDisplay(900, 600);
      document.getElementById("loading").style.display = "none";
      await cheerpjRunJar("/app/roulette.jar");
    })();
  </script>
</body>
</html>
